# Tek doğruluk kaynağı. Kodda hardcode parametre YOK.

seed: 42
seeds: [42, 1337, 2024]        # TBD: 3 mü 5 mi

paths:
  raw:         data/raw
  interim:     data/interim
  processed:   data/processed
  annotations: data/annotations
  human:       data/annotations/human
  models:      models
  figures:     reports/figures
  results:     reports/results

dataset:
  hf_repo: McAuley-Lab/Amazon-Reviews-2023
  categories:
    pilot: raw_review_All_Beauty
    high:  raw_review_Toys_and_Games
    mid:   raw_review_Video_Games
    low:   raw_review_Grocery_and_Gourmet_Food
  meta_prefix: raw_meta_          # örn. raw_meta_Toys_and_Games
  join_key: parent_asin           # asin DEĞİL
  # Ham dosya HF reposundaki yolu. datasets.load_dataset(trust_remote_code=True)
  # artık çalışmıyor (datasets 4.x); dosyayı doğrudan çekiyoruz. Bkz docs/DECISIONS.md.
  review_file_template: raw/review_categories/{slug}.jsonl
  required_fields: [text, title, rating, timestamp, user_id, parent_asin, verified_purchase]
  schema_probe_lines: 1000

preprocess:
  verified_only: true
  min_words: 5
  k_core: 5
  dedup: true                     # aynı user+item -> en erken timestamp
  timestamp_unit: auto            # auto | s | ms

sampling:
  n_annotate: 40000               # TBD: pilot sonrası netleşecek
  strata: [month, rating, text_length_bucket]
  keyword_boost_fraction: 0.15    # ayrı tutulur, ana orana KATILMAZ

detection:
  # Model seçimi VRAM'e değil GPU KUŞAĞINA bağlı. Elimizdeki her GPU pre-Ampere
  # (yerel GTX 1650 Ti ve Kaggle T4 = Turing sm75): bfloat16 yok, FlashAttention
  # yok. Qwen3.5 ailesi hibrit Gated-DeltaNet + vision-language; Turing backend'i
  # pratikte çalışmıyor. Bu yüzden dense/text-only/standart GQA olan bir model
  # seçildi. Gerekçe: technology-review §4.2, docs/DECISIONS.md.
  primary_model:   Qwen/Qwen3-4B-Instruct-2507   # dense 4B, text-only, GQA, non-thinking
  secondary_model: google/gemma-4-E4B            # sadece uyum alt örneklemi
  secondary_sample_n: 5000                       # ikincil model tüm korpusa koşmaz
  quantization: none            # fp16 ağırlık ~8 GB, T4'e sığıyor; AWQ/Marlin riski yok
  dtype: float16                # ZORUNLU: bfloat16 compute capability >= 8.0 istiyor
  max_new_tokens: 220
  temperature: 0.0
  guided_json: true
  retry_on_parse_fail: 1
  schema_path: configs/annotation_schema.json
  prompt_path: prompts/gift_detection_v1.md

distill:
  # ModernBERT verimlilik ve 149M'lik ayak izi için seçildi, 8192 context için
  # DEĞİL: kanıt gövdenin medyan %1-3'ünde duruyor, 512 token'da kayıp yalnızca
  # %0.013-0.044 (data-research §4.8, T5). max_length 1024 bir tavan; ModernBERT
  # unpadding + local attention kullandığı için gerçek maliyet fiili uzunluğa
  # bağlı, tavana değil - yani 1024 bedava.
  base_model: answerdotai/ModernBERT-base
  fallback_model: microsoft/deberta-v3-base   # fidelity gate kaçarsa sağlamlık kontrolü
  max_length: 1024
  epochs: 3
  batch_size: 32
  lr: 3.0e-5
  val_fraction: 0.1

experiment:
  conditions: [C0, C1, C4]                   # MVP. C2/C3 sonra.
  soft_weights: [0.25, 0.5, 0.75]            # C2 için, TBD
  models: [SASRec, BPR]                      # MVP. Pop/ItemKNN/GRU4Rec sonra.
  topk: [10, 20]
  metrics: [Recall, NDCG, HitRate]
  split: temporal_leave_one_out
  eval_rule:
    test_item_must_be: self                  # DEĞİŞTİRİLEMEZ
    freeze_universe_on: C0                   # DEĞİŞTİRİLEMEZ
  bootstrap_iters: 1000

analysis:
  seasonality_months: 12
  # ÖLÇÜLDÜ (data-research §4.5, T14): tepe dört kategoride de Aralık-Ocak.
  # Review timestamp'i satın alma timestamp'inin gerisinde kaldığı için Kasım
  # değil Aralık-Ocak; bu gecikme concept-note'ta önceden not edilmişti.
  # Şubat/Mayıs tepesi ölçümde YOK - beklenen listeden çıkarıldı.
  expected_peaks: [12, 1]

keywords:
  path: configs/gift_keywords.yaml
  precision_sample_n: 100         # elle dogrulanacak eslesme sayisi (T4)
  precision_seed: 42

eda:
  categories: [pilot, high, mid, low]
  min_year: 2000                  # oncesi hacim ihmal edilebilir; grafikleri bozuyor
  figure_dpi: 150
  figure_format: png
  publish_figures_to: ../data-research/figures   # teslim kendi icinde kapali olsun
