# Tek doğruluk kaynağı. Kodda hardcode parametre YOK.

seed: 42
# ⚠️ HENÜZ OKUNMUYOR. Çoklu seed Hafta 7'de (bootstrap + varyans); bugün her
# koşu tek `seed` kullanıyor. TBD: 3 mü 5 mi — koşu süresine göre.
seeds: [42, 1337, 2024]

paths:
  raw:         data/raw
  interim:     data/interim
  processed:   data/processed
  annotations: data/annotations
  human:       data/annotations/human
  models:      models          # damıtılmış öğrenci (detection/distill.py)
  figures:     reports/figures
  results:     reports/results

dataset:
  hf_repo: McAuley-Lab/Amazon-Reviews-2023
  categories:
    pilot: raw_review_All_Beauty
    high:  raw_review_Toys_and_Games
    mid:   raw_review_Video_Games
    low:   raw_review_Grocery_and_Gourmet_Food
  join_key: parent_asin           # asin DEĞİL
  # Ham dosya HF reposundaki yolu. datasets.load_dataset(trust_remote_code=True)
  # artık çalışmıyor (datasets 4.x); dosyayı doğrudan çekiyoruz. Bkz docs/DECISIONS.md.
  review_file_template: raw/review_categories/{slug}.jsonl
  required_fields: [text, title, rating, timestamp, user_id, parent_asin, verified_purchase]
  # Urun metadata'si. Annotation kalitesi icin: LLM "she loved it" cumlesindeki
  # "it"in ne oldugunu bilmeden etiketliyordu, yalnizca dataset kategorisini
  # goruyordu. 4 kategori toplam ~4.35 GB.
  meta_file_template: raw/meta_categories/meta_{slug}.jsonl
  meta_required_fields: [parent_asin, title]
  schema_probe_lines: 1000

preprocess:
  verified_only: true
  min_words: 5
  k_core: 5
  dedup: true                     # aynı user+item -> en erken timestamp
  timestamp_unit: auto            # auto | s | ms

sampling:
  # n_annotate TOPLAM; kategori başına eşit bölünür (40000/4 = 10000). Eşit
  # tahsis, RQ1 kategorileri karşılaştırdığı için doğru seçim: her kategori eşit
  # kesinlikte tahmin alır ve havuzlanmış bir oran raporlanmadığı için havuzlama
  # ağırlığı gerekmez.
  n_annotate: 40000
  strata: [month, rating, text_length_bucket]
  text_length_buckets: [15, 40]   # kelime sayısı kesme noktaları -> 3 kova
  # Vekil-işaretli havuzdan çekilen EK örnek. Distillation eğitim setine daha
  # çok pozitif koymak için. `sample_frame == 'boost'` ile işaretlenir ve
  # yaygınlık hesabına KATILMAZ - katılırsa kendi seçtiğimiz şeyi ölçmüş oluruz.
  keyword_boost_fraction: 0.15
  # "Hediye ALDIM" takviyesi. Vekil bunlari tanim geregi disliyor
  # (kw_gift_proxy = evidence AND NOT received) ama LLM'in ayirmasi gereken en zor
  # negatif sinif bu, ve korpusta %0.08-0.28 gibi seyrek. Takviye edilmezse ne
  # distillation egitim setinde ne de Hafta 4 dogrulama setinde yeterli ornek olur.
  # sample_frame == 'boost_received' ile isaretlenir; yaygınlık hesabina KATILMAZ.
  received_boost_fraction: 0.03

detection:
  # Model seçimi VRAM'e değil GPU KUŞAĞINA bağlı. Elimizdeki her GPU pre-Ampere
  # (yerel GTX 1650 Ti ve Kaggle T4 = Turing sm75): bfloat16 yok, FlashAttention
  # yok. Qwen3.5 ailesi hibrit Gated-DeltaNet + vision-language; Turing backend'i
  # pratikte çalışmıyor. Bu yüzden dense/text-only/standart GQA olan bir model
  # seçildi. Gerekçe: technology-review §4.2, docs/DECISIONS.md.
  primary_model:   Qwen/Qwen3-4B-Instruct-2507   # dense 4B, text-only, GQA, non-thinking
  # Model-arası uyum ölçümü MVP dışı (CLAUDE.md §11) ve kodu yazılmadı. Seçim
  # kayıtta kalsın diye duruyorlar; okuyan kod gelince notlar silinir.
  # Not her anahtarın KENDİ satırında: `tests/test_config_keys.py` bunu tarıyor
  # ve "aşağıdaki iki anahtar" gibi bir ifadeyi makine olarak çözemez.
  secondary_model: google/gemma-4-E4B     # ⚠️ HENÜZ OKUNMUYOR - uyum alt örneklemi
  secondary_sample_n: 5000                # ⚠️ HENÜZ OKUNMUYOR - tüm korpusa koşmaz
  # ⚠️ HENÜZ OKUNMUYOR. `none` dışında bir değer kodda hiçbir şeyi değiştirmez;
  # karar kayıtta kalsın diye duruyor. fp16 ağırlık ~8 GB, T4'e sığıyor.
  quantization: none
  dtype: float16                # ZORUNLU: bfloat16 compute capability >= 8.0 istiyor
  max_new_tokens: 220
  temperature: 0.0
  # `guided_json: true` KALDIRILDI (2026-08-28): hiçbir yerde okunmuyordu ve
  # kapatılabilir bir seçenek olduğunu ima ediyordu. Guided decoding zorunlu
  # (CLAUDE.md §8, kural 3) — `llm_annotate` şemayı koşulsuz uygular.
  retry_on_parse_fail: 1
  schema_path: configs/annotation_schema.json
  # ZORUNLU, pazarlık konusu değil. SYSTEM bloğu ~2.450 token, review medyanı
  # ~30 token: her satırın prefill'inin %99'u aynı. Kapalıysa 47.200 satırda
  # ~116M gereksiz prefill token üretilir ve Kaggle kotası boşa gider.
  # Gerçekleşen ortak önek `llm_annotate` tarafından ÖLÇÜLÜP raporlanıyor.
  enable_prefix_caching: true
  # 2.450 (system) + review + 220 (çıktı). Fazlası KV cache'i şişirir ve batch
  # boyutunu düşürür; review'lar 6.000 karaktere kırpılıyor (~1.500 token).
  max_model_len: 4096
  gpu_memory_utilization: 0.90    # T4 16 GB; fp16 ağırlık ~8 GB + KV cache
  # Kaç VERİ-PARALEL süreç. `auto` = torch.cuda.device_count(); Kaggle'da 2.
  # Model tek T4'e sığdığı için (fp16 ~8 GB / 16 GB) tensor parallel DEĞİL veri
  # parallel doğru seçim: T4'lerde NVLink yok, all-reduce PCIe üzerinden gider
  # ve 4B'lik bir modelde iletişim maliyeti kazancı yer. İki bağımsız süreç
  # birbiriyle hiç konuşmaz, her birinin kendi tam prefix cache'i olur.
  # Kaggle kotası oturum saati olarak sayıldığı için bu kotayı da yarıya indirir.
  gpus: auto
  # Model TEK karta sığmazsa (ör. 14B+) burası 2 yapılır ve `gpus` 1'e düşer.
  # gpus × tensor_parallel_size mevcut GPU sayısını aşamaz — kod kontrol ediyor.
  tensor_parallel_size: 1
  # Çıktı bu boyutta parçalar halinde yazılır. Kaggle oturumu 12 saatte kesilir,
  # GPU OOM olabilir; yeniden başlatıldığında bitmiş satırlar atlanır.
  shard_rows: 2000
  # v1 -> v2: 200 review'luk deneme gecisinden sonra revize edildi. v1 dosyasi
  # silinmedi - hangi annotation hangi prompt'la uretildigi izlenebilsin diye.
  prompt_path: prompts/gift_detection_v3.md

# Hafta 5 — `detection/distill.py` (eğitim) ve `detection/inference.py` okuyor.
distill:
  # ModernBERT verimlilik ve 149M'lik ayak izi için seçildi, 8192 context için
  # DEĞİL: kanıt gövdenin medyan %1-3'ünde duruyor, 512 token'da kayıp yalnızca
  # %0.013-0.044 (data-research §4.8, T5). max_length 1024 bir tavan.
  # DÜZELTME (2026-09-14, eğitimden önce): "1024 bedava" gerekçesi ModernBERT'in
  # dolgu kaldırmasına dayanıyordu ve o yalnızca FlashAttention'la çalışıyor —
  # T4'te (Turing) FlashAttention yok. Tavan yine 1024 (öğretmen 6.000 karakter
  # gördü, girdi eşitliği önemli); bellek `gradient_checkpointing` ile, tahminde
  # token bütçeli gruplarla karşılanıyor.
  base_model: answerdotai/ModernBERT-base
  fallback_model: microsoft/deberta-v3-base   # fidelity gate kaçarsa sağlamlık kontrolü
  max_length: 1024
  epochs: 3
  batch_size: 32
  lr: 3.0e-5
  # transformers'ın sınıflandırma ince ayarı için yaygın varsayılanları; ayar
  # yapılmadı, yapılmayacak (model seçimi yok — `distill.py` başındaki not).
  warmup_ratio: 0.1
  weight_decay: 0.01
  # Sonucu değiştirmez, ~%30 yavaşlatır. Kapalıyken 32 x 1024 token'lık bir grubun
  # aktivasyonları + AdamW durumu 16 GB'lık T4'ü aşar (kaba HESAP ~13 + ~2,4 GB,
  # ÖLÇÜLMEDİ — Kaggle oturumunu bir OOM'a harcamamak için ihtiyatlı seçim).
  gradient_checkpointing: true
  val_fraction: 0.1
  # SADAKAT KAPISI — 2026-09-14'te, HİÇBİR MODEL EĞİTİLMEDEN yazıldı. Deneyin
  # kullandığı iki ikili karar üzerinden ölçülür, beş sınıflı makro-F1 üzerinden
  # değil: C1 `gift_given`'ı, C1b `gift_given`+`household`+`received`'ı çıkarıyor.
  # 0,85 bir yargı: damıtma bu kararlara %15'ten fazla F1 kaybı eklemesin.
  # ModernBERT geçemezse `fallback_model` bir kez denenir; o da geçemezse deney
  # DURUR. Bkz. DECISIONS 2026-09-14.
  fidelity:
    c1_axis_f1_min: 0.85          # öğrenci vs öğretmen, ayrılmış %10
    c1b_axis_f1_min: 0.85         # öğrenci vs öğretmen, ayrılmış %10
    max_drop_vs_teacher_on_human: 0.05   # öğrenci vs insan C1 F1'i, öğretmeninkinden en fazla bu kadar düşük

experiment:
  conditions: [C0, C1, C4]                   # MVP. C2/C3 sonra.
  soft_weights: [0.25, 0.5, 0.75]            # C2 için, TBD
  # ⚠️ HENÜZ OKUNMUYOR: `run_experiment` modeli `--model` ile CLI'dan alıyor.
  # Bu liste Hafta 7'de tüm kombinasyonları süren koşucu yazılınca okunacak.
  models: [SASRec, BPR]                      # MVP. Pop/ItemKNN/GRU4Rec sonra.
  topk: [10, 20]
  metrics: [Recall, NDCG, HitRate]
  split: temporal_leave_one_out
  # ⚠️ HENÜZ OKUNMUYOR — ve okunmaması KASITLI. İki kural da koda GÖMÜLÜ olarak
  # uygulanıyor, config'ten gelmiyor: `run_experiment.write_benchmark_files`
  # test dosyasına yalnızca `label == self` satırlarını yazıyor, `atomic` bölmeyi
  # ve evreni C0'da donduruyor. Yapılandırılabilir olsalardı deneyin geçerliliği
  # bir YAML satırıyla bozulabilirdi. Burada yazılı olmalarının sebebi kuralın
  # görünür kalması; değiştirmek koda dokunmayı gerektirir.
  eval_rule:
    test_item_must_be: self                  # DEĞİŞTİRİLEMEZ
    freeze_universe_on: C0                   # DEĞİŞTİRİLEMEZ
  # ⚠️ HENÜZ OKUNMUYOR. Bootstrap güven aralıkları Hafta 7.
  bootstrap_iters: 1000

# ⚠️ BU BLOĞUN TAMAMI HENÜZ OKUNMUYOR — önceden kayıt; okuyan kod Faz 4'te.
# Kapı 2 — deneyin KURULUMU geçerli mi? ETKİYİ ölçmez. Eşikler 2026-09-14'te,
# HİÇBİR DENEY KOŞUSU YAPILMADAN yazıldı (Kapı 1 ile aynı disiplin). Kategori ×
# model başına dört ölçüt; biri eksikse karar INCOMPLETE:
#   1. test (kullanıcı, ürün) çiftleri bütün koşullarda birebir aynı (hash)
#   2. her koşulun gerçek ürün evreni C0'ın alt kümesi (gölge sonek soyulup)
#   3. plasebo taban çizgisini geçmiyor: (C4 − C0) ve (C4b − C0) kullanıcı başı
#      Recall@10 farkının eşli bootstrap GA'sının alt ucu <= 0
#   4. C0 Recall@10'un seed'ler arası değişim katsayısı < seed_cv_max
gate2:
  metric: Recall@10
  bootstrap_n: 2000
  ci: 0.95
  seed_cv_max: 0.10

analysis:
  # ÖLÇÜLDÜ (data-research §4.5, T14): tepe dört kategoride de Aralık-Ocak.
  # Review timestamp'i satın alma timestamp'inin gerisinde kaldığı için Kasım
  # değil Aralık-Ocak; bu gecikme concept-note'ta önceden not edilmişti.
  # Şubat/Mayıs tepesi ölçümde YOK - beklenen listeden çıkarıldı.
  expected_peaks: [12, 1]

# Kapı 1 — Hafta 3 sonu, "detektör çalışıyor mu?" Eşikler KOŞUDAN ÖNCE, sonuç
# görülmeden yazıldı (2026-08-28). Sonucu gördükten sonra eşik gevşetmek, κ
# eşiğinde reddettiğimiz şeyin aynısı: bulguyu geçersiz kılar. Gevşetme
# gerekiyorsa docs/DECISIONS.md'ye tarih + gerekçe yazılır.
gate1:
  # 1) MEVSİMSELLİK. Aralık+Ocak hediye oranı ÷ Haziran-Eylül oranı. Sözcüksel
  # vekil dört kategoride de 1,34-1,90 aralığında veriyor (T14); LLM en az bu
  # kadarını görmeli. Eşik alt sınırın (Toys 1,34) biraz altında bilerek: LLM
  # vekilin kaçırdığı mevsimsel-olmayan vakaları da yakalarsa oran doğal olarak
  # bir miktar seyrelir.
  seasonality_ratio_min: 1.25
  seasonality_bootstrap_n: 2000   # oranın %95 GA'sı 1,0'ı dışlamalı
  # 2) VEKİL ÖTESİ RECALL. Anahtar kelimenin İŞARETLEMEDİĞİ satırlarda LLM'in
  # bulduğu gift_given oranı. Sıfıra yakınsa LLM, bedava vekilin işini pahalıya
  # tekrar ediyor demektir ve bütün damıtma yığını gereksizdir.
  beyond_keyword_rate_min: 0.01
  # 3) ŞEMA SAĞLIĞI.
  parse_fail_rate_max: 0.01
  span_downgrade_rate_max: 0.10
  # 4) DUMAN TESTİ. 200 satırlık deneme setiyle uyum. F1 OLARAK RAPORLANMAZ:
  # prompt v2/v3 tam bu satırlar okunarak yazıldı (DECISIONS 2026-08-26).
  # Yalnızca "aşırı tetikleme var mı" sorusunu yanıtlar.
  trial_agreement_min: 0.70
  # Mevsimsellik hangi aylardan okunuyor
  peak_months: [12, 1]
  trough_months: [6, 7, 8, 9]

# Hafta 4 — insan doğrulaması. Projenin TEK gerçek referansı: damıtma ve bütün
# öneri deneyi bu ölçümün üstüne kuruluyor. Eşikler 2026-08-29'da, HİÇBİR SONUÇ
# GÖRÜLMEDEN sabitlendi (Kapı 1'in eşikleriyle aynı disiplin).
validation:
  n: 500
  # Etiketi TOPLANAN etiketleyiciler. Tasarım üç kişiydi (A, B, C) ve sayfalar
  # üç harfle üretildi; yalnızca A teslim etti (2026-09-14). Burada yalnızca
  # okunacak olanlar yazılı — adı geçmeyen bir sayfa ölçüme GİREMEZ.
  annotators: [A]
  # Etiket güvenilirliği: `fleiss` (≥2 etiketleyici) ya da `none`. `none` ->
  # Hafta 4 kapısı INCOMPLETE kalır, asla PASS yazılmaz. Etiketleyici sayısıyla
  # tutarsız bir değer gürültülü hata verir. Kullanıcı kararı, 2026-09-14.
  reliability: none
  # Ölçüm yöntemi (2026-09-14, A'nın etiketleri modelle karşılaştırılmadan ÖNCE):
  # ters olasılık ağırlığında bu değerin altındaki (kategori × LLM sınıfı)
  # hücresinin kütlesi o sınıfın bütün kategorilerine dağıtılır; kalibrasyonda
  # `main` satırı bu değerden az olan sınıf tüm çerçevelere düşer.
  min_cell_n: 5
  bootstrap_n: 2000
  # LLM ETİKETİNE göre katmanlı — sözcüksel vekile göre değil. Bu bir yaygınlık
  # örneği DEĞİL: `household` ve `received` bilerek fazla temsil ediliyor.
  # Gerekçe ölçüldü (2026-08-29 deneme koşusu): uyuşmazlıkların %42'si tek yönde,
  # insan `household` / model `gift_given`. Sınır orası, örnek de oraya bakmalı.
  # `received` `main` çerçevesinde %0,60 — orantılı çekilse 3 satır düşerdi ve
  # o sınıfın F1'i de κ'sı da anlamsız olurdu.
  strata:
    gift_given: 150
    household: 150
    self: 100
    unclear: 60
    received: 40
  # Kategori ağırlıkları. Toys iki kat: birincil deney kategorisi ve k-core'da
  # hediye oranını koruyan tek kategori (T8).
  role_weights: {high: 2, mid: 1, low: 1, pilot: 1}
  # Fleiss' kappa eşiği. BEŞ SINIFTA DA 0,60'ta BIRAKILDI. κ sınıf sayısı arttıkça
  # düşme eğilimindedir ve bunu bilerek eşiği peşinen düşürmek, kapıyı koşudan
  # önce gevşetmenin başka bir biçimi olurdu. Bunun yerine iki kural yazıldı:
  # sınıf bazlı κ ayrıca raporlanır, ve az örnekli sınıf genel κ'ya girmez.
  kappa_min: 0.60
  # Genel κ'ya girmek için gereken en az örnek. Altında kalan sınıf hesaba
  # KATILMAZ ve ayrıca listelenir. Öngörülen: `received` (~40 çekiliyor ama
  # uzlaşı sonrası düşebilir). Kural sonuç görülmeden yazıldı.
  min_class_n_for_kappa: 20

keywords:
  path: configs/gift_keywords.yaml
  precision_sample_n: 100         # elle dogrulanacak eslesme sayisi (T4)
  precision_seed: 42

eda:
  categories: [pilot, high, mid, low]
  min_year: 2000                  # oncesi hacim ihmal edilebilir; grafikleri bozuyor
  figure_dpi: 150
  figure_format: png
  publish_figures_to: ../data-research/figures   # teslim kendi icinde kapali olsun
